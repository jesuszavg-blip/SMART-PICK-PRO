name: Keep Streamlit App Alive

on:
  schedule:
    # Se ejecuta cada 15 minutos (24/7)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub si lo deseas

jobs:
  ping-service:
    name: Ping Smart Pick Pro
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit Cloud & Custom Domain
        run: |
          echo "📡 Enviando señal de actividad a Smart Pick Pro..."
          
          # 1. Ping a la app directa en Streamlit
          HTTP_STREAMLIT=$(curl -s -o /dev/null -w "%{http_code}" -L \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            https://smart-pick-pro.streamlit.app)
          echo "✅ Streamlit Cloud respondió con código HTTP: $HTTP_STREAMLIT"

          # 2. Ping al dominio principal
          HTTP_DOMAIN=$(curl -s -o /dev/null -w "%{http_code}" -L \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            https://smartpickprojz.com.mx)
          echo "✅ Dominio Oficial respondió con código HTTP: $HTTP_DOMAIN"

          echo "🚀 Ping completado a las $(date -u) UTC. La app permanece activa."
