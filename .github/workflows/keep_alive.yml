name: Keep Streamlit App Alive

on:
  schedule:
    # Se ejecuta cada 15 minutos automáticamente las 24 horas del día
    - cron: '*/15 * * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub cuando quieras

jobs:
  ping-service:
    name: Ping Smart Pick Pro
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit Cloud & Custom Domain
        run: |
          echo "📡 Enviando señal de actividad a Smart Pick Pro..."
          
          # Ping a Streamlit Cloud
          HTTP_STREAMLIT=$(curl -s -o /dev/null -w "%{http_code}" -L \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            https://smart-pick-pro.streamlit.app)
          echo "✅ Streamlit Cloud respondió con código: $HTTP_STREAMLIT"

          # Ping al dominio personalizado
          HTTP_DOMAIN=$(curl -s -o /dev/null -w "%{http_code}" -L \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            https://smartpickprojz.com.mx)
          echo "✅ Dominio Oficial respondió con código: $HTTP_DOMAIN"

          echo "🚀 Ping completado exitosamente. La app se mantiene despierta."
